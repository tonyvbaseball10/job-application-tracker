{% extends 'base.html' %}{% block title %}{{ 'Edit' if job else 'Add' }} job · JobTracker{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">Opportunity record</p><h1>{{ 'Edit job' if job else 'Add job' }}</h1><p>Store role details and the skills used by Job Match.</p></div></div>
<form class="form-card" method="post"><div class="form-grid"><label>Company *<select name="company_id" required><option value="">Choose company</option>{% for c in companies %}<option value="{{ c.company_id }}" {{ 'selected' if request.form.get('company_id', job.company_id if job else '')|string == c.company_id|string else '' }}>{{ c.company_name }}</option>{% endfor %}</select></label><label>Job title *<input name="job_title" maxlength="100" required value="{{ request.form.get('job_title', job.job_title if job else '') }}"></label><label>Job type *<select name="job_type" required>{% for type in JOB_TYPES %}<option {{ 'selected' if request.form.get('job_type', job.job_type if job else 'Full-time') == type else '' }}>{{ type }}</option>{% endfor %}</select></label><label>Date posted<input name="date_posted" type="date" value="{{ request.form.get('date_posted', job.date_posted if job and job.date_posted else '') }}"></label><label>Minimum salary<input name="salary_min" type="number" min="0" step="1000" value="{{ request.form.get('salary_min', job.salary_min if job else '') or '' }}"></label><label>Maximum salary<input name="salary_max" type="number" min="0" step="1000" value="{{ request.form.get('salary_max', job.salary_max if job else '') or '' }}"></label><label class="wide">Job URL<input name="job_url" type="url" maxlength="300" placeholder="https://" value="{{ request.form.get('job_url', job.job_url if job else '') or '' }}"></label><label class="wide">Required skills <span>Comma-separated or JSON array</span><textarea name="requirements" rows="4" placeholder="Python, SQL, Flask">{{ request.form.get('requirements', job.requirements if job else '') or '' }}</textarea></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('jobs') }}">Cancel</a><button class="button primary" type="submit">Save job</button></div></form>
{% endblock %}
