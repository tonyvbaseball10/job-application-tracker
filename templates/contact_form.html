{% extends 'base.html' %}{% block title %}{{ 'Edit' if contact else 'Add' }} contact · JobTracker{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">Contact record</p><h1>{{ 'Edit contact' if contact else 'Add contact' }}</h1><p>Save the people who can help move an application forward.</p></div></div>
<form class="form-card" method="post"><div class="form-grid"><label>Company *<select name="company_id" required><option value="">Choose company</option>{% for c in companies %}<option value="{{ c.company_id }}" {{ 'selected' if request.form.get('company_id', contact.company_id if contact else '')|string == c.company_id|string else '' }}>{{ c.company_name }}</option>{% endfor %}</select></label><label>Contact name *<input name="contact_name" maxlength="100" required value="{{ request.form.get('contact_name', contact.contact_name if contact else '') }}"></label><label>Title<input name="title" maxlength="100" value="{{ request.form.get('title', contact.title if contact else '') or '' }}"></label><label>Email<input name="email" type="email" maxlength="100" value="{{ request.form.get('email', contact.email if contact else '') or '' }}"></label><label>Phone<input name="phone" type="tel" maxlength="20" value="{{ request.form.get('phone', contact.phone if contact else '') or '' }}"></label><label>LinkedIn URL<input name="linkedin_url" type="url" maxlength="200" placeholder="https://linkedin.com/in/..." value="{{ request.form.get('linkedin_url', contact.linkedin_url if contact else '') or '' }}"></label><label class="wide">Notes<textarea name="notes" rows="5">{{ request.form.get('notes', contact.notes if contact else '') or '' }}</textarea></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('contacts') }}">Cancel</a><button class="button primary" type="submit">Save contact</button></div></form>
{% endblock %}
