{% extends 'base.html' %}{% block title %}{{ 'Edit' if company else 'Add' }} company · JobTracker{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">Company record</p><h1>{{ 'Edit company' if company else 'Add company' }}</h1><p>Capture the employer details you will reference throughout your search.</p></div></div>
<form class="form-card" method="post"><div class="form-grid"><label class="wide">Company name *<input name="company_name" maxlength="100" required value="{{ request.form.get('company_name', company.company_name if company else '') }}"></label><label>Industry<input name="industry" maxlength="50" value="{{ request.form.get('industry', company.industry if company else '') or '' }}"></label><label>Website<input name="website" type="url" maxlength="200" placeholder="https://" value="{{ request.form.get('website', company.website if company else '') or '' }}"></label><label>City<input name="city" maxlength="50" value="{{ request.form.get('city', company.city if company else '') or '' }}"></label><label>State<input name="state" maxlength="50" value="{{ request.form.get('state', company.state if company else '') or '' }}"></label><label class="wide">Notes<textarea name="notes" rows="5">{{ request.form.get('notes', company.notes if company else '') or '' }}</textarea></label></div><div class="form-actions"><a class="button secondary" href="{{ url_for('companies') }}">Cancel</a><button class="button primary" type="submit">Save company</button></div></form>
{% endblock %}
